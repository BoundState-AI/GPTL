[project]
name = "boundstate-gptl"
version = "0.1.0"
description = "Deterministic GPTL safety substrate and MIE diagnostic engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "rfc8785>=0.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --capture=sys"
