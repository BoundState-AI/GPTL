[project]
name = "boundstate-gptl"
version = "0.1.0"
description = "Deterministic GPTL safety substrate and MIE diagnostic engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "rfc8785>=0.1,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --capture=sys"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
